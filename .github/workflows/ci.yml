name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stecar-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start native PostgreSQL for backend tests
        run: |
          sudo systemctl start postgresql
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "STECAR_TEST_DB_USER=stecar_test" >> "$GITHUB_ENV"
          echo "STECAR_TEST_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          printf "CREATE ROLE stecar_test LOGIN PASSWORD '%s';\n" "$password" | sudo -u postgres psql -v ON_ERROR_STOP=1
          sudo -u postgres createdb --owner=stecar_test stecar_test
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/quasar-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/quasar-project/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
