spring.application.name=stecar-backend

server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stecar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Sem valor padrão: a aplicação não sobe sem STECAR_JWT_SECRET (mínimo de 64 caracteres, HS512).
stecar.jwt.secret=${STECAR_JWT_SECRET}
stecar.jwt.expiracao-minutos=${STECAR_JWT_EXPIRACAO_MINUTOS:30}

stecar.admin.email=${STECAR_ADMIN_EMAIL:joaonavarro@car.ba.gov.br}
stecar.admin.nome=${STECAR_ADMIN_NOME:João Navarro}
stecar.admin.senha=${STECAR_ADMIN_PASSWORD:}

# SMTP para recuperação de senha. Em desenvolvimento, o envio fica desabilitado até configurar o host.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
stecar.frontend-url=${STECAR_FRONTEND_URL:http://localhost:9001}
stecar.mail.from=${MAIL_FROM:}
